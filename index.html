<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>전자기 유도 에너지 전환 시뮬레이션</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --wire: #f4c430;
    --wire-dark: #c99a1e;
    --metal: #cbd5e1;
    --metal-dark: #94a3b8;
    --body-yellow: #fde047;
    --body-yellow-dark: #eab308;
    --crank: #2dd4bf;
    --crank-dark: #0f9488;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --board: #f8fafc;
    --board-stroke: #cbd5e1;
    --board-shadow: #94a3b8;
    --post: #d4d9e0;
    --post-stroke: #64748b;
    --post-core: #b45309;
    --lever: #b6bdc7;
    --lever-dark: #6b7684;
    --knob: #e8eaed;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
  }
  header {
    flex: 0 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid #334155;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
  }
  header .stage {
    font-size: 13px;
    color: var(--text-dim);
  }
  main {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    min-height: 0;
  }
  #circuitStage {
    width: 100%;
    height: 100%;
    max-width: 1400px;
  }
  svg { width: 100%; height: 100%; display: block; }

  .label {
    font-size: 22px;
    font-weight: 700;
    fill: var(--text);
    text-anchor: middle;
  }
  .sublabel {
    font-size: 15px;
    fill: var(--text-dim);
    text-anchor: middle;
  }
  .wire {
    fill: none;
    stroke: var(--wire);
    stroke-width: 7;
    stroke-linecap: round;
  }
  .wire-outline {
    fill: none;
    stroke: var(--wire-dark);
    stroke-width: 11;
    stroke-linecap: round;
  }

  #crankHotspotA {
    fill: transparent;
    cursor: pointer;
    touch-action: none;
  }
  .press-ring {
    fill: none;
    stroke: #5eead4;
    stroke-width: 4;
    opacity: 0;
    pointer-events: none;
  }
  #genA.holding .press-ring {
    opacity: 0.9;
  }
  .hint {
    font-size: 14px;
    fill: var(--text-dim);
    text-anchor: middle;
  }

  footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 14px 24px 20px;
    border-top: 1px solid #334155;
  }
  .readout {
    text-align: center;
    min-width: 160px;
  }
  .readout .value {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .readout .caption {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  #resetBtn {
    min-height: 48px;
    padding: 0 20px;
    border-radius: 10px;
    border: 1px solid #475569;
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #resetBtn:active { background: #334155; }

  .switch-hit {
    cursor: pointer;
  }
  .switch-hit.locked {
    cursor: not-allowed;
    opacity: 0.55;
  }
  #energyBar {
    flex: 0 0 auto;
    padding: 10px 24px 0;
  }
  #energyBar .bar {
    display: flex;
    height: 26px;
    border-radius: 8px;
    overflow: hidden;
    background: #1e293b;
    border: 1px solid #334155;
  }
  #energyBar .seg {
    height: 100%;
    transition: width 0.35s ease;
  }
  .seg-loss { background: #64748b; }
  .seg-light { background: #fbbf24; }
  .seg-sound { background: #38bdf8; }
  .seg-toB { background: #34d399; }

  .legend {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .legend .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .legend b {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>전자기 유도 에너지 전환 시뮬레이션</h1>
    <span class="stage">3단계 체크포인트 · 스위치 + 에너지 모델 + 예산 막대</span>
  </header>
  <main>
    <div id="circuitStage">
      <svg viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg">

        <defs>
          <linearGradient id="wireGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fde68a"/>
            <stop offset="0.5" stop-color="var(--wire)"/>
            <stop offset="1" stop-color="var(--wire-dark)"/>
          </linearGradient>
          <radialGradient id="bodyGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0" stop-color="#fef9c3"/>
            <stop offset="0.55" stop-color="var(--body-yellow)"/>
            <stop offset="1" stop-color="var(--body-yellow-dark)"/>
          </radialGradient>
          <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
          </filter>

          <!-- 재사용 심볼: 스프링 단자(구리 코일 + 은색 캡) -->
          <g id="post">
            <circle r="10" fill="var(--post)" stroke="var(--post-stroke)" stroke-width="2"/>
            <circle r="4.5" fill="var(--post-core)"/>
            <path d="M -7 -2 A 8 8 0 0 1 -1 -8" fill="none" stroke="#f0b978" stroke-width="1.5" opacity="0.8"/>
          </g>

          <!-- 재사용 심볼: 악어 클립 -->
          <g id="clip-red">
            <path d="M -20 0 L 8 -8 L 20 0 L 8 8 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
            <path d="M 6 -9 L 6 9 M 12 -7 L 12 7 M 18 -4 L 18 4" stroke="#7f1d1d" stroke-width="1.5"/>
          </g>
          <g id="clip-black">
            <path d="M -20 0 L 8 -8 L 20 0 L 8 8 Z" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
            <path d="M 6 -9 L 6 9 M 12 -7 L 12 7 M 18 -4 L 18 4" stroke="#0f172a" stroke-width="1.5"/>
          </g>
        </defs>

        <!-- ============ 전선 (뒤에 깔림) ============ -->
        <!-- 인출선은 항상 회로(가운데) 쪽을 향한 면에서 나온다: A는 오른쪽 면, B는 왼쪽 면 -->
        <g id="wires" fill="none" stroke="url(#wireGrad)" stroke-width="7" stroke-linecap="round">
          <!-- 짧은 인출선: 발전기 몸통 옆면(회로 쪽) -> 클립 크림프 -->
          <path d="M 260 285 C 268 285 274 286 280 286" />
          <path d="M 260 345 C 268 344 274 343 280 343" />
          <path d="M 1140 285 C 1132 285 1126 286 1120 286" />
          <path d="M 1140 345 C 1132 344 1126 346 1120 347" />

          <!-- 클립A(빨강) 조 -> 스위치1 좌측 단자 (위쪽 공용 레일) -->
          <path d="M 320 284 C 420 250 520 210 650 205" />
          <!-- 스위치1 좌측 -> 스위치2 좌측 (병렬 입력 공유 레일) -->
          <path d="M 650 205 C 720 190 780 190 850 205" />
          <!-- 스위치2 좌측 -> 클립B(빨강) 조 -->
          <path d="M 850 205 C 950 230 1020 260 1080 284" />

          <!-- 스위치1 우측 단자 -> 꼬마전구 좌측 단자 (단자에 정확히 착지) -->
          <path d="M 750 214 C 745 260 700 300 660 336" />
          <!-- 스위치2 우측 단자 -> 버저 좌측 단자 -->
          <path d="M 950 214 C 945 260 900 300 860 336" />

          <!-- 클립A(검정) 조 -> 꼬마전구 우측 단자 (아래쪽 공용 레일, 보드 밑으로 처짐. 단일 곡선이라 꺾임 없음) -->
          <path d="M 320 347 C 450 480 600 470 740 336" />
          <!-- 꼬마전구 우측 -> 버저 우측 (아래쪽 공용 레일 계속, 처짐) -->
          <path d="M 740 336 C 800 445 880 445 940 336" />
          <!-- 버저 우측 -> 클립B(검정) 조 -->
          <path d="M 940 336 C 1000 400 1040 385 1080 343" />
        </g>

        <!-- ============ 클립 4개 (조: 회로 방향 / 크림프: 발전기 인출선) ============ -->
        <use href="#clip-red" transform="translate(300,285) rotate(-4)"/>
        <use href="#clip-black" transform="translate(300,345) rotate(6)"/>
        <use href="#clip-red" transform="translate(1100,285) rotate(184)"/>
        <use href="#clip-black" transform="translate(1100,345) rotate(186)"/>

        <!-- ============ 손발전기 A ============ -->
        <g id="genA" filter="url(#softShadow)">
          <rect x="120" y="230" width="140" height="150" rx="28" fill="url(#bodyGrad)" stroke="var(--body-yellow-dark)" stroke-width="4"/>
          <circle cx="190" cy="230" r="46" fill="url(#bodyGrad)" stroke="var(--body-yellow-dark)" stroke-width="4"/>
          <g id="genA-crank" transform="rotate(-20 190 230)">
            <rect x="184" y="150" width="12" height="90" rx="6" fill="var(--crank)" stroke="var(--crank-dark)" stroke-width="3"/>
            <circle cx="190" cy="150" r="14" fill="var(--crank)" stroke="var(--crank-dark)" stroke-width="3"/>
          </g>
          <circle cx="190" cy="230" r="10" fill="var(--crank-dark)"/>
          <circle class="press-ring" cx="190" cy="230" r="88"/>
        </g>
        <circle id="crankHotspotA" cx="190" cy="230" r="88"/>
        <text class="label" x="190" y="462">손발전기 A</text>
        <text class="sublabel" x="190" y="487">(에너지 투입)</text>
        <text id="aHint" class="hint" x="190" y="507">손잡이를 누르고 있으면 돌아가요</text>

        <!-- ============ 손발전기 B ============ -->
        <g id="genB" filter="url(#softShadow)">
          <rect x="1140" y="230" width="140" height="150" rx="28" fill="url(#bodyGrad)" stroke="var(--body-yellow-dark)" stroke-width="4"/>
          <circle cx="1210" cy="230" r="46" fill="url(#bodyGrad)" stroke="var(--body-yellow-dark)" stroke-width="4"/>
          <g id="genB-crank" transform="rotate(20 1210 230)">
            <rect x="1204" y="150" width="12" height="90" rx="6" fill="var(--crank)" stroke="var(--crank-dark)" stroke-width="3"/>
            <circle cx="1210" cy="150" r="14" fill="var(--crank)" stroke="var(--crank-dark)" stroke-width="3"/>
          </g>
          <circle cx="1210" cy="230" r="10" fill="var(--crank-dark)"/>
        </g>
        <text class="label" x="1210" y="462">손발전기 B</text>
        <text class="sublabel" x="1210" y="487">(측정 대상)</text>

        <!-- ============ 스위치 1 ============ -->
        <g id="switch1" class="switch-hit" data-closed="false">
          <rect x="610" y="160" width="180" height="90" rx="14" fill="var(--board)" stroke="var(--board-stroke)" stroke-width="2" filter="url(#softShadow)"/>
          <use href="#post" x="650" y="205"/>
          <use href="#post" x="750" y="205"/>
          <!-- 회전축 캡 -->
          <circle cx="650" cy="205" r="6" fill="var(--lever-dark)"/>
          <g id="switch1-lever" transform="rotate(-32 650 205)">
            <rect x="650" y="200" width="100" height="10" rx="5" fill="var(--lever)" stroke="var(--lever-dark)" stroke-width="1.5"/>
            <ellipse cx="738" cy="205" rx="12" ry="9" fill="var(--knob)" stroke="var(--lever-dark)" stroke-width="1.5"/>
          </g>
        </g>
        <text class="label" x="700" y="145">스위치 1 · <tspan id="switch1Status" fill="var(--text-dim)" font-size="15" font-weight="500">열림</tspan></text>

        <!-- ============ 스위치 2 ============ -->
        <g id="switch2" class="switch-hit" data-closed="false">
          <rect x="810" y="160" width="180" height="90" rx="14" fill="var(--board)" stroke="var(--board-stroke)" stroke-width="2" filter="url(#softShadow)"/>
          <use href="#post" x="850" y="205"/>
          <use href="#post" x="950" y="205"/>
          <circle cx="850" cy="205" r="6" fill="var(--lever-dark)"/>
          <g id="switch2-lever" transform="rotate(-32 850 205)">
            <rect x="850" y="200" width="100" height="10" rx="5" fill="var(--lever)" stroke="var(--lever-dark)" stroke-width="1.5"/>
            <ellipse cx="938" cy="205" rx="12" ry="9" fill="var(--knob)" stroke="var(--lever-dark)" stroke-width="1.5"/>
          </g>
        </g>
        <text class="label" x="900" y="145">스위치 2 · <tspan id="switch2Status" fill="var(--text-dim)" font-size="15" font-weight="500">열림</tspan></text>

        <!-- ============ 꼬마전구 ============ -->
        <g id="bulb">
          <rect x="630" y="330" width="140" height="95" rx="14" fill="var(--board)" stroke="var(--board-stroke)" stroke-width="2" filter="url(#softShadow)"/>
          <!-- 단자 -> 소켓 내부 배선 (보드 안에서 실제로 이어짐) -->
          <path d="M 660 340 L 660 358 Q 660 366 668 366 L 692 366" fill="none" stroke="var(--post-stroke)" stroke-width="3" stroke-linecap="round"/>
          <path d="M 740 340 L 740 358 Q 740 366 732 366 L 708 366" fill="none" stroke="var(--post-stroke)" stroke-width="3" stroke-linecap="round"/>
          <rect x="686" y="360" width="28" height="14" rx="2" fill="var(--post-stroke)"/>
          <circle id="bulb-glass" cx="700" cy="398" r="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
          <path d="M 689 388 Q 700 379 711 388 M 689 406 Q 700 415 711 406" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round"/>
          <use href="#post" x="660" y="340"/>
          <use href="#post" x="740" y="340"/>
        </g>
        <text class="label" x="700" y="450">꼬마전구</text>

        <!-- ============ 버저 ============ -->
        <g id="buzzer">
          <rect x="830" y="330" width="140" height="95" rx="14" fill="var(--board)" stroke="var(--board-stroke)" stroke-width="2" filter="url(#softShadow)"/>
          <!-- 단자 -> 버저 하우징 내부 배선 -->
          <path d="M 860 340 L 860 358 Q 860 366 868 366 L 872 366" fill="none" stroke="var(--post-stroke)" stroke-width="3" stroke-linecap="round"/>
          <path d="M 940 340 L 940 358 Q 940 366 932 366 L 928 366" fill="none" stroke="var(--post-stroke)" stroke-width="3" stroke-linecap="round"/>
          <rect id="buzzer-body" x="866" y="358" width="68" height="52" rx="8" fill="#334155" stroke="#1e293b" stroke-width="3"/>
          <circle cx="900" cy="384" r="18" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
          <circle cx="900" cy="384" r="10" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
          <circle cx="900" cy="384" r="3" fill="#94a3b8"/>
          <use href="#post" x="860" y="340"/>
          <use href="#post" x="940" y="340"/>
        </g>
        <text class="label" x="900" y="450">버저</text>

      </svg>
    </div>
  </main>
  <section id="energyBar">
    <div class="bar">
      <div class="seg seg-loss" id="segLoss"></div>
      <div class="seg seg-light" id="segLight"></div>
      <div class="seg seg-sound" id="segSound"></div>
      <div class="seg seg-toB" id="segToB"></div>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:#64748b"></i>저항·마찰 손실 <b id="lossVal">13</b></span>
      <span><i class="dot" style="background:#fbbf24"></i>빛 에너지(전구) <b id="lightVal">0</b></span>
      <span><i class="dot" style="background:#38bdf8"></i>소리 에너지(버저) <b id="soundVal">0</b></span>
      <span><i class="dot" style="background:#34d399"></i>B로 전달 <b id="toBVal">87</b></span>
    </div>
  </section>
  <footer>
    <div class="readout">
      <div class="value" id="aCountDisplay">0/10회</div>
      <div class="caption">A 손잡이</div>
    </div>
    <div class="readout">
      <div class="value" id="bResultDisplay">—</div>
      <div class="caption">B 손잡이 회전수</div>
    </div>
    <button id="resetBtn" type="button">다시 하기</button>
  </footer>
</div>
<script>
(function () {
  'use strict';

  var TICK_MS = 600;       // 0.6초당 1회 -> 10회 = 6초
  var TARGET_COUNT = 10;
  var ROTATION_SPEED = 320; // deg/sec, 누르는 동안의 시각적 회전 속도
  var LOSS = 13;            // 저항·마찰 손실, 항상 발생
  var LIGHT_COST = 24;      // 스위치1(꼬마전구) 닫힘 시 소비
  var SOUND_COST = 3;       // 스위치2(버저) 닫힘 시 소비

  var sim = {
    count: 0,
    holding: false,
    finished: false,
    aAngle: -20,
    bAngle: 20,
    rafId: null,
    tickTimer: null,
    lastFrameTime: null,
    bResult: null,
    switch1Closed: false,
    switch2Closed: false
  };

  var genA = document.getElementById('genA');
  var crankA = document.getElementById('genA-crank');
  var crankB = document.getElementById('genB-crank');
  var hotspotA = document.getElementById('crankHotspotA');
  var aCountDisplay = document.getElementById('aCountDisplay');
  var bResultDisplay = document.getElementById('bResultDisplay');
  var aHint = document.getElementById('aHint');
  var resetBtn = document.getElementById('resetBtn');
  var switch1 = document.getElementById('switch1');
  var switch2 = document.getElementById('switch2');
  var lever1 = document.getElementById('switch1-lever');
  var lever2 = document.getElementById('switch2-lever');
  var switch1Status = document.getElementById('switch1Status');
  var switch2Status = document.getElementById('switch2Status');
  var segLoss = document.getElementById('segLoss');
  var segLight = document.getElementById('segLight');
  var segSound = document.getElementById('segSound');
  var segToB = document.getElementById('segToB');
  var lossVal = document.getElementById('lossVal');
  var lightVal = document.getElementById('lightVal');
  var soundVal = document.getElementById('soundVal');
  var toBVal = document.getElementById('toBVal');

  function applyCrankTransforms() {
    crankA.setAttribute('transform', 'rotate(' + sim.aAngle + ' 190 230)');
    crankB.setAttribute('transform', 'rotate(' + sim.bAngle + ' 1210 230)');
  }

  function energyBreakdown() {
    var light = sim.switch1Closed ? LIGHT_COST : 0;
    var sound = sim.switch2Closed ? SOUND_COST : 0;
    var toB = 100 - LOSS - light - sound;
    return { loss: LOSS, light: light, sound: sound, toB: toB };
  }

  function updateEnergyBar() {
    var e = energyBreakdown();
    segLoss.style.width = e.loss + '%';
    segLight.style.width = e.light + '%';
    segSound.style.width = e.sound + '%';
    segToB.style.width = e.toB + '%';
    lossVal.textContent = e.loss;
    lightVal.textContent = e.light;
    soundVal.textContent = e.sound;
    toBVal.textContent = e.toB;
  }

  function tweenRotate(el, fromDeg, toDeg, cx, cy, duration) {
    var start = null;
    function step(now) {
      if (start == null) start = now;
      var t = Math.min(1, (now - start) / duration);
      var eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      var angle = fromDeg + (toDeg - fromDeg) * eased;
      el.setAttribute('transform', 'rotate(' + angle + ' ' + cx + ' ' + cy + ')');
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function switchesLocked() {
    return sim.count > 0;
  }

  function refreshSwitchLockUI() {
    var locked = switchesLocked();
    switch1.classList.toggle('locked', locked);
    switch2.classList.toggle('locked', locked);
  }

  function toggleSwitch(which) {
    if (switchesLocked()) return;
    var closed, lever, cx, statusEl;
    if (which === 1) {
      sim.switch1Closed = !sim.switch1Closed;
      closed = sim.switch1Closed; lever = lever1; cx = 650; statusEl = switch1Status;
    } else {
      sim.switch2Closed = !sim.switch2Closed;
      closed = sim.switch2Closed; lever = lever2; cx = 850; statusEl = switch2Status;
    }
    tweenRotate(lever, closed ? -32 : 0, closed ? 0 : -32, cx, 205, 220);
    statusEl.textContent = closed ? '닫힘' : '열림';
    updateEnergyBar();
  }

  switch1.addEventListener('click', function () { toggleSwitch(1); });
  switch2.addEventListener('click', function () { toggleSwitch(2); });

  function animate(now) {
    if (sim.lastFrameTime == null) sim.lastFrameTime = now;
    var dt = (now - sim.lastFrameTime) / 1000;
    sim.lastFrameTime = now;
    var delta = ROTATION_SPEED * dt;
    sim.aAngle += delta;
    sim.bAngle -= delta;
    applyCrankTransforms();
    if (sim.holding) {
      sim.rafId = requestAnimationFrame(animate);
    }
  }

  function tick() {
    if (sim.finished) return;
    sim.count++;
    if (sim.count >= TARGET_COUNT) {
      sim.count = TARGET_COUNT;
      updateUI();
      finish();
      return;
    }
    updateUI();
  }

  function startHold() {
    if (sim.finished || sim.holding) return;
    sim.holding = true;
    sim.lastFrameTime = null;
    genA.classList.add('holding');
    sim.rafId = requestAnimationFrame(animate);
    sim.tickTimer = setInterval(tick, TICK_MS);
    updateUI();
  }

  function stopHold() {
    if (!sim.holding) return;
    sim.holding = false;
    genA.classList.remove('holding');
    if (sim.rafId) cancelAnimationFrame(sim.rafId);
    if (sim.tickTimer) clearInterval(sim.tickTimer);
    sim.rafId = null;
    sim.tickTimer = null;
    updateUI();
  }

  function finish() {
    stopHold();
    sim.finished = true;
    var toB = energyBreakdown().toB;
    var jitter = (Math.random() * 2 - 1) * 0.15;
    sim.bResult = Math.round((toB * 0.1 + jitter) * 10) / 10;
    updateUI();
  }

  function reset() {
    stopHold();
    sim.count = 0;
    sim.finished = false;
    sim.bResult = null;
    sim.aAngle = -20;
    sim.bAngle = 20;
    applyCrankTransforms();
    refreshSwitchLockUI();
    updateUI();
  }

  function updateUI() {
    aCountDisplay.textContent = sim.count + '/10회';
    bResultDisplay.textContent = sim.bResult != null ? sim.bResult.toFixed(1) + '회' : '—';
    if (sim.finished) {
      aHint.textContent = '10회 완료! 다시 하기를 눌러 재시작하세요';
    } else if (sim.holding) {
      aHint.textContent = '누르는 중… 손을 떼면 멈춰요';
    } else if (sim.count > 0) {
      aHint.textContent = '손잡이를 누르고 있으면 이어서 돌아가요';
    } else {
      aHint.textContent = '스위치를 정하고 손잡이를 누르고 있으면 돌아가요';
    }
    refreshSwitchLockUI();
  }

  hotspotA.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { hotspotA.setPointerCapture(e.pointerId); } catch (err) {}
    startHold();
  });
  hotspotA.addEventListener('pointerup', stopHold);
  hotspotA.addEventListener('pointercancel', stopHold);
  hotspotA.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'mouse') stopHold();
  });

  resetBtn.addEventListener('click', reset);

  updateEnergyBar();
  updateUI();
})();
</script>
</body>
</html>
